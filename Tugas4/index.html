<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tugas 4 - JavaScript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Benedictus Alphonsius Putra Prasetya</h1>
        <p>NIM: 255314064</p>
      </div>
    </header>

    <main>
      <section id="step1">
        <div class="row">
          <label for="nama">Nama :</label>
          <input type="text" id="nama" placeholder="Teks Nama" />
        </div>
        <div class="row">
          <label for="jml">Jumlah Pilihan :</label>
          <input type="number" id="jml" min="1" max="20" placeholder="Jml" />
        </div>
        <button id="ok1">OK</button>
        <p class="error" id="err1"></p>
      </section>

      <section id="step2" hidden>
        <div id="daftarPilihan"></div>
        <button id="ok2">OK</button>
        <p class="error" id="err2"></p>
      </section>

      <section id="step3" hidden>
        <div class="row top">
          <label>Pilihan :</label>
          <div id="wadahPilihan"></div>
        </div>
        <button id="ok3">OK</button>
        <p class="error" id="err3"></p>
      </section>

      <section id="step4" hidden>
        <div class="row">
          <label for="email">Email :</label>
          <input type="text" id="email" placeholder="email@domain.com" />
        </div>
        <button id="ok4">OK</button>
        <p class="error" id="err4"></p>
      </section>

      <section id="hasil" hidden>
        <p id="kalimat"></p>
        <button id="ulang" class="sekunder">Ulangi</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
